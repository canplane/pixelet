// @pxl/native/modules/platform/android/build.gradle
//
// The device's half of the app's platform on Android (src/main/java/…), and
// the kernel linked with it: the Rust core (crates/client-bracket/native) built by
// apps/native/script/build-native.ts for each variant the app is built as,
// before the variant's native libraries are merged — the same kernel, and the
// same guarantee, as an iPhone's pod phase gives (ios/PxlPlatform.podspec).

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'me.plei.pixelet'
version = '0.0.0'

android {
  namespace "me.plei.pixelet.platform"
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.16.0'
}

// Each variant's library in a directory of its own, which the variant alone
// packs.
["debug", "release"].each { variant ->
  def out = layout.buildDirectory.dir("kernel/${variant}")
  android.sourceSets[variant].jniLibs.srcDirs += out.get().asFile

  def build = tasks.register("buildKernel${variant.capitalize()}", Exec) {
    // cargo is what knows whether the kernel is current, and answers in a
    // moment when it is: the task runs every build.
    outputs.upToDateWhen { false }
    workingDir rootProject.projectDir
    def home = System.getProperty("user.home")
    // rustup's and Deno's installers put their tools in the home directory,
    // which Gradle's PATH need not name.
    environment "PATH", "${home}/.cargo/bin:${home}/.deno/bin:${System.getenv("PATH")}"
    doFirst {
      commandLine "${projectDir}/../../../script/build-native.ts", "--android",
        "--variant", variant,
        "--out", out.get().asFile.absolutePath,
        "--ndk", android.ndkDirectory.absolutePath,
        "--api", rootProject.ext.minSdkVersion.toString()
    }
  }
  tasks.matching { it.name == "merge${variant.capitalize()}JniLibFolders" }.configureEach { dependsOn build }
}
