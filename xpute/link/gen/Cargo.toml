[package]
name = "xpute-link-gen"
description = "The link's generator: its bindings from WIT"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["src/**/*.test.rs"]

[lib]
path = "src/lib.rs"

# The command a program runs to write its bindings or check them.
[[bin]]
name = "xpute-link-gen"
path = "src/main.rs"

# The generator depends on no crate of the workspace but the generator's
# writer, because it writes into them.
[dependencies]
xpute-gen.workspace = true
wit-parser = "=0.263.0"

[lints]
workspace = true
