[package]
name = "xpute-gpu-native-host"
description = "The GPU's host on a native device: it runs the records an xpute guest writes on wgpu"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["src/**/*.test.rs"]

[lib]
path = "src/lib.rs"

[dependencies]
xpute-gpu-link.workspace = true
xpute-link.workspace = true
xpute-kit.workspace = true
# It serves the GPU on xpute-native-runtime's link, on the guest's thread.
xpute-native-runtime.workspace = true
# wgpu runs the records, its serde names read the spec's, and an external
# image is decoded here where the web asks its browser.
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "serde"] }
serde = "1"
png = "0.18"
image-webp = "0.2"
zune-jpeg = "0.5"
# This waits out the adapter's and the device's futures as a device opens
# (`open`), which wgpu resolves at once on a native backend, so no async runtime
# is needed.
pollster = "1"

[dev-dependencies]
# The tests take the golden records' reader.
xpute-golden.workspace = true
# This is a device with no GPU under it, which makes and maps buffers but runs
# nothing. The host's CPU tests stage their writes on it
# (src/lib.noop.test.rs).
wgpu = { version = "30", default-features = false, features = ["noop"] }
