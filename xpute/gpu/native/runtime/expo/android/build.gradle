// @xpute/gpu-native-runtime/android/build.gradle
//
// This is the GPU's module (src/main/java/xpute/), the view a guest's surface
// draws into and the GPU's host beside xpute's. Its classes are JNI's names
// in the package `xpute`, and load the library xpute's module builds
// (`xpute.BuildConfig`).

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xpute'
version = '0.1.0'

android {
  namespace "xpute.gpu"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation project(':xpute-native-runtime')
}
