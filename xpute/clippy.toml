# xpute has one rounding, half to even, as WGSL rounds (ARCHITECTURE.md,
# `math/scalar`). These methods round half away from zero, and only the named
# variants of math::scalar call them.
disallowed-methods = [
    { path = "f64::round", reason = "round half to even: f64::round_ties_even, or xpute_kit::math::scalar::round" },
    { path = "f32::round", reason = "round half to even: f32::round_ties_even, or xpute_kit::math::scalar::round" },
]

# What `absolute_paths` lets stand in a body: the standard library's own paths
# (`core::mem::swap`), and no path of more than a crate and a module. A longer
# one is a `use` at the top of its module, as the Book has it: a function,
# constant or static through its module (`use xpute_link::mem;` then
# `mem::load_acquire()`), a type whole; a path only `mod tests` uses is imported
# there. Where a module's own names take another's, the full path stands under
# `#[expect(clippy::absolute_paths, reason = "…")]`.
absolute-paths-allowed-crates = ["std", "core", "alloc"]
absolute-paths-max-segments = 2
