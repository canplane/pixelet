[package]
name = "xpute-test-mem"
edition.workspace = true
version.workspace = true
# A test process's guest memory, for the tests of xpute and of any program
# whose test takes offsets of the guest's memory; it is never published.
publish = false

[lib]
path = "src/lib.rs"

# The region is set as the guest's memory, whose offsets xpute-link reads.
[dependencies]
xpute-link.workspace = true
