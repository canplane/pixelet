[package]
name = "xpute-native-host"
description = "xpute's host on a native device: what it serves the guest, on its runtime's link"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["src/**/*.test.rs"]

[lib]
path = "src/lib.rs"

[dependencies]
xpute-kit.workspace = true
# The contract's pure types, shared rather than copied: an answer given later
# (clock.rs).
xpute-link.workspace = true
# The environment the host runs in: the guest's thread and its loop, the
# link it serves on, and the bindings of what it serves.
xpute-native-runtime.workspace = true

[dev-dependencies]
# The clock's test links a guest beside the runtime, as an app does, over a
# test's guest memory (src/clock.test.rs).
xpute-guest.workspace = true
xpute-test-mem.workspace = true

# A process starts one runtime and links one guest, so the test is a binary of
# its own, on the runtime's process tests' app (xpute-native-runtime
# src/app.test.rs).
[[test]]
name = "clock"
path = "src/clock.test.rs"
