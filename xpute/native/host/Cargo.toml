[package]
name = "xpute-native-host"
description = "xpute's host on a native device: what it serves the guest, on its runtime's link"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xpute-kit.workspace = true
# The contract's pure types, shared rather than copied: a URI's tokens and an
# answer given later (disk.rs, clock.rs).
xpute-link.workspace = true
# The environment the host runs in: the guest's thread and its loop, the
# link it serves on, and the bindings of what it serves.
xpute-native-runtime.workspace = true
