// @xpute/native-runtime/android/build.gradle
//
// This is xpute's module on Android (src/main/java/xpute/), and the guest
// linked with it: the app's guest crate, as the app's package.json
// `xpute.guest` names it, which the app builds and packs.

import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xpute'
version = '0.1.0'

// The app is the directory over its android/.
def app = rootProject.projectDir.parentFile
def guest = new JsonSlurper().parse(new File(app, "package.json")).xpute?.guest
if (guest == null) {
  throw new GradleException("${app}/package.json names no xpute.guest")
}

android {
  namespace "xpute"
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName "0.1.0"
    // The library Runtime.kt and @xpute/gpu-native-runtime's Gpu.kt load: cargo's name for the crate's.
    buildConfigField "String", "GUEST", "\"${guest.package.replace('-', '_')}\""
  }
  buildFeatures {
    buildConfig true
  }
}
