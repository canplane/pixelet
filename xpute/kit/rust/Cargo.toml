[package]
name = "xpute-kit"
description = "The generic code under both of xpute's ends: collections, codecs, scalar math, an errno table and the wire formats"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["src/**/*.test.rs"]

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# Everything but `math::rng`. Without it the kit is `no_std` and holds the
# seeds alone.
std = []

[dev-dependencies]
hex.workspace = true
xpute-golden.workspace = true

[lints]
workspace = true
