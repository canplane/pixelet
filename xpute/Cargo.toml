# This is xpute's Rust, laid out by part, each part's language its leaf.
# `kit/rust` is what any program that links it may use. `link/rust` is the
# link, the protocol both sides run, and its code. `guest/rust` asks to be run
# its way (an entry at a time, a deadline measured from the frame, I/O asked of
# its host), and it depends on `kit` and the link, never the reverse.
# `host/rust` is the host in Rust: its end of the link, the bindings mounted
# there and what it implements; `runtime/native` is the native runtime, the
# environment the host runs in, which injects into the host what it needs of
# it: the way back to the guest's thread, where a report goes and the log.
# A program may bring
# plugins of its own, in its own tree, each repeating the link, the guest and
# the host. `gen` is the data specs' generator, and `gen-targets` what it makes
# of xpute's parts; `link/gen` the bindings' generator, which carries xpute's
# packages itself and is the command a program runs. `golden/rust` is the
# golden records' reader the tests take, and `tool` xpute's own use of the
# generator.

[workspace]
resolver = "3"
members = [
    "kit/rust",
    "link/rust",
    "guest/rust",
    "host/rust",
    "runtime/native",
    "gen",
    "link/gen",
    "gen-targets",
    "golden/rust",
    "tool",
]

[workspace.dependencies]
# Each of the workspace's own crates is given by its path once, so a crate
# names another by name.
xpute-kit = { path = "kit/rust", version = "0.1.0" }
xpute-link = { path = "link/rust", version = "0.1.0" }
xpute-guest = { path = "guest/rust", version = "0.1.0" }
xpute-host = { path = "host/rust", version = "0.1.0" }
xpute-runtime-native = { path = "runtime/native", version = "0.1.0" }
xpute-gen = { path = "gen", version = "0.1.0" }
xpute-link-gen = { path = "link/gen", version = "0.1.0" }
xpute-gen-targets = { path = "gen-targets" }
xpute-golden = { path = "golden/rust" }
# A test reads a golden packet's bytes back with this.
hex = "0.4"

# The lints each of xpute's crates takes (`[lints] workspace = true`).
[workspace.lints.rust]
# A path no longer than what is already in scope.
unused_qualifications = "warn"

[workspace.lints.clippy]
# A path past a crate and one module is brought in by a `use` at the top of
# its module, so what a file reaches for is read in one place.
absolute_paths = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
# A lint is let pass by `#[expect]`, which says so once it no longer fires,
# and with its reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# What stands in for code while it is written does not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# An `unsafe` block says, in a `// SAFETY:` comment, why it holds.
undocumented_unsafe_blocks = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.package]
edition = "2024"
version = "0.1.0"
# The Rust the crates are built and tested with (rust-toolchain.toml), which
# cargo refuses to build them below.
rust-version = "1.100"
publish = true
# The library crates (kit, link, guest, host, native runtime, gen) carry
# these for a registry.
license = "MIT"
repository = "https://github.com/canplane/xpute"
readme = "README.md"

# A guest is a module someone downloads, so its size is what it is built for;
# a trap ends a guest, so nothing unwinds.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
