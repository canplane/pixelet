# This is xpute's Rust, laid out by platform. `kit/rust` is what any program
# that links it may use. `link/rust` is the link, the protocol both sides run,
# and its code. `guest/rust` asks to be run its way (an entry at a time, a
# deadline measured from the frame, I/O asked of its host), and it depends on
# `kit` and the link, never the reverse. `native/runtime/rust` is the runtime
# on a native device, the environment its host runs in: the guest's thread,
# the host's link and the UI's channel; `native/host` is the host, what it
# serves over that link. The GPU plugin has the same shape: `gpu/link/rust`
# is what both of its sides take, WebGPU's vocabulary among it,
# `gpu/guest/rust` the guest's encoder of its calls to a device it cannot
# reach, `gpu/native/runtime/rust` the bindings its host on a native device
# serves on `native/runtime/rust`'s link, and `gpu/native/host` that host. `gen` is the
# data specs' generator, and each part's `gen-targets` what it makes of the
# part; `link/gen` the bindings' generator, which carries xpute's packages
# itself and is the command a program runs. `dev/` holds what develops them:
# `golden/rust`, the golden records' reader the tests take, and xpute's own
# use of the generator (`tool`).

[workspace]
resolver = "2"
members = [
    "kit/rust",
    "link/rust",
    "guest/rust",
    "native/runtime/rust",
    "native/host",
    "gpu/link/rust",
    "gpu/guest/rust",
    "gpu/native/runtime/rust",
    "gpu/native/host",
    "gpu/gen-targets",
    "gen",
    "link/gen",
    "gen-targets",
    "dev/golden/rust",
    "dev/tool",
]

[workspace.dependencies]
# Each of the workspace's own crates is given by its path once, so a crate
# names another by name.
xpute-kit = { path = "kit/rust", version = "0.1.0" }
xpute-link = { path = "link/rust", version = "0.1.0" }
xpute-guest = { path = "guest/rust", version = "0.1.0" }
xpute-native-runtime = { path = "native/runtime/rust", version = "0.1.0" }
xpute-native-host = { path = "native/host", version = "0.1.0" }
xpute-gpu-link = { path = "gpu/link/rust", version = "0.1.0" }
xpute-gpu-guest = { path = "gpu/guest/rust", version = "0.1.0" }
xpute-gpu-native-runtime = { path = "gpu/native/runtime/rust", version = "0.1.0" }
xpute-gpu-native-host = { path = "gpu/native/host", version = "0.1.0" }
xpute-gpu-gen-targets = { path = "gpu/gen-targets" }
xpute-gen = { path = "gen", version = "0.1.0" }
xpute-link-gen = { path = "link/gen", version = "0.1.0" }
xpute-gen-targets = { path = "gen-targets" }
xpute-golden = { path = "dev/golden/rust" }
# A test reads a golden packet's bytes back with this.
hex = "0.4"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = true
# The library crates (kit, link, guest, native runtime and host, the GPU's
# link, guest and native runtime and host, gen) carry these for a registry.
license = "MIT"
repository = "https://github.com/canplane/xpute"
readme = "README.md"

# A guest is a module someone downloads, so its size is what it is built for;
# a trap ends a guest, so nothing unwinds.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The native GPU host's wgpu, the fork wgpu-fork.md holds.
[patch.crates-io]
naga = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
naga-types = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-core = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-core-deps-apple = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-hal = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-naga-bridge = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
wgpu-types = { git = "https://github.com/canplane/fork.wgpu", rev = "2cbb4a993b05dcce6e65e40ad3eb3ffc629c05f0" }
