[package]
name = "xpute-runtime"
description = "xpute's runtime end in Rust: a core's memory by offset, and a core linked into the runtime's own native process"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["src/**/*.test.rs"]

[lib]
path = "src/lib.rs"

[dependencies]
xpute-core.workspace = true
xpute-kit.workspace = true

# A native runtime maps the core's memory from the system
# (src/native/reserve.rs), and `native` is unix's alone.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# An Android app reaches a native core through JNI (src/jni.rs), and a stop is
# told to the NDK's log (src/native/say.rs). These are the NDK's own headers as
# bindings, with nothing over them.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
ndk-sys = "0.6"

# Each test binary is its own process, since a process boots one core and sets
# one base (xpute_core::mem): the boot and the core's thread, the allocator
# installed as a test binary's own, and a pause.
[[test]]
name = "native"
path = "src/native.test.rs"

[[test]]
name = "native-alloc"
path = "src/native/alloc.test.rs"

[[test]]
name = "native-pause"
path = "src/native/pause.test.rs"

[lints.clippy]
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
