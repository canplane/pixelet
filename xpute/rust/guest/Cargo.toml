[package]
name = "xpute-guest"
description = "xpute's guest end: a program its host runs in turns over one memory they share, as a WebAssembly module or linked into the host"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xpute-kit.workspace = true

# An `as` cast to a pointer is an offset made a pointer; mem.rs (`at`,
# `Memory::at`) is the one way to do that.
[lints.clippy]
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
