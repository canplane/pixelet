# This is the Rust kit, and the two ends over it. `kit` is what any program
# that links it may use. `core` asks to be run its way (a turn on a doorbell,
# a deadline measured from the frame, I/O asked of the runtime), and it depends
# on `kit`, never the reverse. `runtime` is the runtime's end in Rust, for a
# core linked into the runtime's own native process. `gpu` is WebGPU's
# vocabulary for a core's calls to a device it cannot reach, beside both. A
# core's form lives in its end's path: `core`'s `wasm` (a module's link
# arguments, which a build script takes it for, and its entry) and `runtime`'s
# `native`. `dev/` holds what develops them: `conformance`, the core the contract's traces
# drive (spec/conformance/), the example and the generator.

[workspace]
resolver = "2"
members = ["kit", "core", "runtime", "gpu", "dev/conformance", "dev/example", "dev/tool"]

[workspace.dependencies]
# Each of the workspace's own crates is given by its path once, so a crate
# names another by name.
xpute-kit = { path = "kit" }
xpute-core = { path = "core" }
xpute-runtime = { path = "runtime" }
# A test reads a golden packet's bytes back with this.
hex = "0.4"

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false
# The library crates (kit, core, runtime, gpu) carry these for a registry.
license = "MIT"
repository = "https://github.com/canplane/xpute"
readme = "../README.md"

# A core is a module someone downloads, so its size is what it is built for;
# a trap ends a core, so nothing unwinds.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# wgpu with one hal command buffer per encoder on every backend, and the iOS
# Simulator's Metal capabilities: what the fork changes is xpute/rust/gpu/README.md's.
[patch.crates-io]
naga = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
naga-types = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-core = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-core-deps-apple = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-hal = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-naga-bridge = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
wgpu-types = { git = "https://github.com/canplane/fork.wgpu", rev = "f68999dfdc5f957ee3008bfd014df7400dfe04e7" }
