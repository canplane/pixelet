# The Rust kit, and the two ends over it. `kit` is what any program that
# links it may use; `guest` asks to be run its way — a turn on a doorbell, a
# quota measured from the frame, I/O asked of the host — and depends on
# `kit`, never the reverse; `host` is the host's end in Rust, for a guest
# linked into the host's own native process. `gpu` is WebGPU's vocabulary
# for a guest's calls to a device it cannot reach, beside both. A guest's
# form lives in its end's path: `guest`'s `wasm` (a module's link arguments,
# which a build script takes it for, and its entry) and `host`'s `native`.
# `conformance` is the guest the contract's traces drive (spec/conformance/).

[workspace]
resolver = "2"
members = ["kit", "guest", "host", "gpu", "conformance"]

[workspace.dependencies]
# The workspace's own crates, each by its path once, so a crate names another
# by name.
xpute-kit = { path = "kit" }
xpute-guest = { path = "guest" }
xpute-host = { path = "host" }
# A set whose position is the value: insert appends, swap_remove moves the
# last entry into the hole, and a caller keeps its own lanes at the same
# positions.
indexmap = "2"
# What a test reads a golden packet's bytes back as.
hex = "0.4"

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

# A guest is a module someone downloads, so its size is what it is built for;
# a trap ends a guest, so nothing unwinds.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
