[package]
name = "xpute-host"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xpute-guest.workspace = true
xpute-kit.workspace = true

# The core memory a native host reserves, mapped from the system
# (src/native/reserve.rs). `native` is unix's alone.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Each its own process, since a process boots one guest and sets one base
# (xpute_guest::mem): the boot and the guest's thread, and the
# allocator installed as a test binary's own.
[[test]]
name = "native"
path = "src/native.test.rs"

[[test]]
name = "native-alloc"
path = "src/native/alloc.test.rs"

[lints.clippy]
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
