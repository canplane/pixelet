[package]
name = "xpute-conformance"
edition.workspace = true
version.workspace = true
# The contract's proof, not what a program links: never published, whatever
# the workspace's libraries come to be.
publish = false

# The traces are run by the host, not by a test in this crate.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
xpute-kit = { path = "../kit" }
xpute-guest = { path = "../guest" }

# Its link flags as a module (build.rs).
[build-dependencies]
xpute-link = { path = "../link" }
