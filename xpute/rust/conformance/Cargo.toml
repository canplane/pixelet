[package]
name = "xpute-conformance"
edition.workspace = true
version.workspace = true
# The contract's proof is not what a program links, so it is never published,
# whatever the workspace's libraries come to be.
publish = false

# The traces are run by the runtime, not by a test in this crate.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
xpute-kit.workspace = true
xpute-core.workspace = true

# A build script takes its link flags as a module from this (build.rs,
# xpute_core::wasm `link`).
[build-dependencies]
xpute-core.workspace = true
