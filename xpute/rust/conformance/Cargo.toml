[package]
name = "xpute-conformance"
edition.workspace = true
version.workspace = true
# The contract's proof, not what a program links: never published, whatever
# the workspace's libraries come to be.
publish = false

# The traces are run by the host, not by a test in this crate.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
xpute-kit.workspace = true
xpute-guest.workspace = true

# Its link flags as a module (build.rs, xpute_guest::wasm `link`).
[build-dependencies]
xpute-guest.workspace = true
