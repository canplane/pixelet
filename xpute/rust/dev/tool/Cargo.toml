[package]
name = "xpute-tool"
edition.workspace = true
version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# This writes xpute's own files, generated from its spec/: `cargo spec` says
# what is stale, and `cargo spec --write` writes it.
[[bin]]
name = "spec"
path = "src/bin/spec.rs"

# The tool depends on no crate it writes into, only on the generator.
[dependencies]
xpute-gen.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
