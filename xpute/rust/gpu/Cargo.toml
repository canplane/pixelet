[package]
name = "xpute-gpu"
description = "WebGPU's calls, which an xpute core writes and its runtime runs"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xpute-core.workspace = true
xpute-kit.workspace = true
# The runtime's end below reads the core's memory by offset
# (xpute_runtime::mem). wgpu already brings libc where xpute-runtime takes it,
# and xpute-runtime depends on nothing of this crate's.
xpute-runtime = { workspace = true, optional = true }
# These serve the runtime's end on a native device (src/runtime.rs), which a
# core never links: wgpu runs the records, its serde names read the spec's, and
# an external image is decoded here where the web asks its browser.
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "serde"], optional = true }
serde = { version = "1", optional = true }
png = { version = "0.18", optional = true }
image-webp = { version = "0.2", optional = true }
zune-jpeg = { version = "0.5", optional = true }
# This waits out the adapter's and the device's futures as a device opens
# (`open`), which wgpu resolves at once on a native backend, so no async runtime
# is needed.
pollster = { version = "1", optional = true }

[features]
runtime = ["dep:xpute-runtime", "dep:wgpu", "dep:serde", "dep:png", "dep:image-webp", "dep:zune-jpeg", "dep:pollster"]

[dev-dependencies]
# The tests take the golden records' reader, and ask for a device without an
# async runtime.
xpute-kit = { workspace = true, features = ["golden"] }
pollster = "1"
# This is a device with no GPU under it, which makes and maps buffers but runs
# nothing. The runtime's CPU tests stage their writes on it
# (src/runtime.noop.test.rs).
wgpu = { version = "30", default-features = false, features = ["noop"] }
