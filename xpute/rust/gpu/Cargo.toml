[package]
name = "xpute-gpu"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
xpute-guest = { path = "../guest" }
xpute-kit = { path = "../kit" }
# The guest's memory as a host reads it by offset (xpute_host::mem), for the
# host's end below: wgpu already brings libc where xpute-host takes it, and
# xpute-host depends on nothing of this crate's.
xpute-host = { path = "../host", optional = true }
# The host's end on a native device (src/host.rs), which a guest never links:
# wgpu runs the records, its serde names read the spec's, and an external
# image is decoded here where the web asks its browser.
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "serde"], optional = true }
serde = { version = "1", optional = true }
png = { version = "0.18", optional = true }
image-webp = { version = "0.2", optional = true }
zune-jpeg = { version = "0.5", optional = true }

[features]
host = ["dep:xpute-host", "dep:wgpu", "dep:serde", "dep:png", "dep:image-webp", "dep:zune-jpeg"]

[dev-dependencies]
# The golden records' reader, and a device asked for without a runtime.
xpute-kit = { path = "../kit", features = ["golden"] }
pollster = "1"
