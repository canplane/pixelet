[package]
name = "pxl-native"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# Linked into the device app's binary, as pxl-wasm is instantiated by the page.
# An Android app loads a shared library instead, which its build asks cargo
# for by name (apps/native/script/build-native.ts, `--crate-type cdylib`), so
# no iPhone build links one it would not use.
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
xpute-kit = { path = "../../../xpute/rust/kit" }
xpute-guest = { path = "../../../xpute/rust/guest" }
pxl-kernel = { path = "../../client/kernel", default-features = false }
pxl-render = { path = "../../client/render", features = ["device"] }
# The view's layer or window made a surface on (src/surface.rs); the device
# and every call on it are pxl-render's. Metal on an iPhone, Vulkan on
# Android; each backend compiles to nothing on the other's system.
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl"] }
# The kernel's region, mapped from the system (src/memory.rs).
libc = "0.2"

# What an Android app reaches the kernel through (src/android.rs): the NDK's
# own headers — JNI, the native window a view's surface is, and the log —
# as bindings and nothing over them.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
jni-sys = "0.3"

[features]
# Forwarded to the kernel, as pxl-wasm forwards it: on for a build anyone
# works on.
default = ["dev"]
dev = ["pxl-kernel/dev"]

[lints]
workspace = true
