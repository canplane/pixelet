[package]
name = "pxl-render"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
fnv.workspace = true
libm.workspace = true
xpute-guest = { path = "../../../xpute/rust/guest" }
xpute-kit = { path = "../../../xpute/rust/kit" }
pxl-spec = { path = "../../spec" }
# The GPU's decor pass's bounds and the record it writes (gpu/renderer.rs).
pxl-portable = { path = "../../portable" }

# WebGPU's calls written into a stream (gpu/api.rs): xpute's encoder, which
# the page's host and the device app's run alike.
xpute-gpu = { path = "../../../xpute/rust/gpu" }

[build-dependencies]
# The zooms the screen's rays are painted by (build.rs `lattice.wgsl`).
pxl-portable = { path = "../../portable" }

[dev-dependencies]
# The shaders' validator, under `cargo test` only: never in the module.
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
