[package]
name = "xpute-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
fnv.workspace = true
indexmap.workspace = true
xpute-core = { path = "../core" }

# The vectors' reader, for this crate's own tests.
[dev-dependencies]
xpute-core = { path = "../core", features = ["golden"] }

# A pointer changes type by `.cast()` and a reference becomes one by `&raw`
# or `ptr::from_ref`, so an `as *const` or `as *mut` left is an offset made a
# pointer: what mem/base.rs exists to be the one way to.
[lints.clippy]
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
