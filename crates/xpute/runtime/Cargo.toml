[package]
name = "xpute-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
indexmap.workspace = true
xpute-core = { path = "../core" }

# An `as` cast to a pointer is an offset made a pointer; mem/base.rs is the
# one way to do that.
[lints.clippy]
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
