[package]
name = "pxl-spec"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# The shapes both servers answer with, as serde types. The kernel compiles
# this crate to wasm and reads a page through xpute's own codec, so it takes
# neither serde nor the weight of it.
serde = ["dep:serde"]

[dependencies]
fnv.workspace = true
libm.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
xpute-core = { path = "../../xpute/rust/core" }

[dev-dependencies]
hex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xpute-core = { path = "../../xpute/rust/core", features = ["golden"] }
