[package]
name = "pxl-geo"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pxl-geo"
path = "src/main.rs"

[dependencies]
fnv.workspace = true
axum = "0.8"
deadpool-postgres = "0.14"
pxl-server = { path = ".." }
pxl-spec = { path = "../../spec", features = ["serde"] }
pxl-geo-spec = { path = "../geo-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio-postgres over sqlx: sqlx's checked queries need a database at build time.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
