# The Rust half of the client: one core, compiled to one WebAssembly module
# that the main thread and each worker instantiate for themselves.
# issue/20260912-why-the-destination-is-wasm.md; BACKLOG P0.

[workspace]
resolver = "2"
members = ["xpute/core", "pxl/spec", "pxl/render", "pxl/kernel", "pxl/wasm"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# The name section is not stripped here. What is published is what Binaryen
# finishes (apps/web/script/build_wasm.ts): it strips the name, producers and
# target-features sections and minifies the host ABI's names in one pass, and
# it has to read the target features before it can take them off — which it
# cannot do if Cargo has already thrown them away.

[profile.dev]
panic = "abort"
