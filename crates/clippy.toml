# pxl's floating point is the same bits on every platform: a transcendental
# goes through the pinned libm (crates/Cargo.toml), not the platform's.
disallowed-methods = [
    { path = "f64::sin", replacement = "libm::sin" },
    { path = "f64::cos", replacement = "libm::cos" },
    { path = "f64::tan", replacement = "libm::tan" },
    { path = "f64::asin", replacement = "libm::asin" },
    { path = "f64::acos", replacement = "libm::acos" },
    { path = "f64::atan", replacement = "libm::atan" },
    { path = "f64::atan2", replacement = "libm::atan2" },
    { path = "f64::sinh", replacement = "libm::sinh" },
    { path = "f64::cosh", replacement = "libm::cosh" },
    { path = "f64::tanh", replacement = "libm::tanh" },
    { path = "f64::asinh", replacement = "libm::asinh" },
    { path = "f64::acosh", replacement = "libm::acosh" },
    { path = "f64::atanh", replacement = "libm::atanh" },
    { path = "f64::exp", replacement = "libm::exp" },
    { path = "f64::exp2", replacement = "libm::exp2" },
    { path = "f64::exp_m1", replacement = "libm::expm1" },
    { path = "f64::ln", replacement = "libm::log" },
    { path = "f64::ln_1p", replacement = "libm::log1p" },
    { path = "f64::log2", replacement = "libm::log2" },
    { path = "f64::log10", replacement = "libm::log10" },
    { path = "f64::powf", replacement = "libm::pow" },
    { path = "f64::cbrt", replacement = "libm::cbrt" },
    { path = "f64::hypot", replacement = "libm::hypot" },
    { path = "f64::sin_cos", replacement = "libm::sincos" },
    { path = "f32::sin", replacement = "libm::sinf" },
    { path = "f32::cos", replacement = "libm::cosf" },
    { path = "f32::tan", replacement = "libm::tanf" },
    { path = "f32::asin", replacement = "libm::asinf" },
    { path = "f32::acos", replacement = "libm::acosf" },
    { path = "f32::atan", replacement = "libm::atanf" },
    { path = "f32::atan2", replacement = "libm::atan2f" },
    { path = "f32::sinh", replacement = "libm::sinhf" },
    { path = "f32::cosh", replacement = "libm::coshf" },
    { path = "f32::tanh", replacement = "libm::tanhf" },
    { path = "f32::asinh", replacement = "libm::asinhf" },
    { path = "f32::acosh", replacement = "libm::acoshf" },
    { path = "f32::atanh", replacement = "libm::atanhf" },
    { path = "f32::exp", replacement = "libm::expf" },
    { path = "f32::exp2", replacement = "libm::exp2f" },
    { path = "f32::exp_m1", replacement = "libm::expm1f" },
    { path = "f32::ln", replacement = "libm::logf" },
    { path = "f32::ln_1p", replacement = "libm::log1pf" },
    { path = "f32::log2", replacement = "libm::log2f" },
    { path = "f32::log10", replacement = "libm::log10f" },
    { path = "f32::powf", replacement = "libm::powf" },
    { path = "f32::cbrt", replacement = "libm::cbrtf" },
    { path = "f32::hypot", replacement = "libm::hypotf" },
    { path = "f32::sin_cos", replacement = "libm::sincosf" },
]

# A map's order is the same on every run: std's hasher is seeded per process.
disallowed-types = [
    { path = "std::collections::HashMap", replacement = "fnv::FnvHashMap" },
    { path = "std::collections::HashSet", replacement = "fnv::FnvHashSet" },
]
