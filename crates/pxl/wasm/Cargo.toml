[package]
name = "pxl-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
# The module links against an imported memory and the glue's imports; it has
# no native test binary. The core's tests are pxl-core's and xpute-core's.
test = false
doctest = false

[dependencies]
xpute-core = { path = "../../xpute/core" }
pxl-shared = { path = "../../pxl/shared" }
pxl-render = { path = "../../pxl/render" }
pxl-core = { path = "../../pxl/core" }
# The executor the module polls its tasks on inside a turn (src/executor.rs).
# No platform feature: the pender is the module's own, and the platform one
# for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"
