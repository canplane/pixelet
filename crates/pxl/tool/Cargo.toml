[package]
name = "pxl-tool"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# No workspace crate is a dependency: the generators write into them and must
# build when that output is broken.
[dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
regex = "1"
# `image` encodes WebP lossless only; the sheet is lossy q92.
webp = "0.3"
flate2 = "1"
ureq = "2"
# Half the size of `image`'s JPEG encoder for the link preview.
mozjpeg = "0.10"

