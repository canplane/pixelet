[package]
name = "pxl-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# What both servers need to start and nothing either one answers with. The
# routes and the queries are each server's own; the shell around them is not.
[dependencies]
axum = "0.8"
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["net"] }
tokio-postgres = "0.7"
tower-http = { version = "0.7", features = ["compression-gzip"] }

# `oneshot`, to drive the shell in a test without a listener.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
