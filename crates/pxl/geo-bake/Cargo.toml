[package]
name = "pxl-geo-bake"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pxl-spec = { path = "../spec" }
xpute-core = { path = "../../xpute/core" }
# The blocking client rather than tokio-postgres, which pxl-geo takes. A page
# is five queries, a pack and a rasterize, and the pack and the rasterize are
# `Rc`-backed throughout (issue/20260918-the-server-in-rust-and-the-line-already-drawn.md):
# on a synchronous client the whole page is one call that nothing has to be
# `Send` across, and the concurrency is a thread per worker with a connection
# of its own. It is tokio-postgres underneath either way.
postgres = "0.19"
