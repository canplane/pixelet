[package]
name = "pxl-kernel"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
fnv.workspace = true
indexmap.workspace = true
libm.workspace = true
xpute-runtime = { path = "../../../xpute/runtime" }
xpute-core = { path = "../../../xpute/core" }
pxl-spec = { path = "../../spec" }
pxl-render = { path = "../render" }

[features]
# The settings schema.json marks `dev`: in the table, so that a development
# build can offer them. A published module is built without (pxl-wasm's
# `dev`, off by apps/web/script/build-wasm.ts), and then neither their names
# nor their rows are in it — what such a setting does, the module still does,
# at the default the JSON gives.
default = ["dev"]
dev = []
