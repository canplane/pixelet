[package]
name = "pxl-kernel"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
fnv.workspace = true
indexmap.workspace = true
libm.workspace = true
xpute-runtime = { path = "../../../xpute/runtime" }
xpute-core = { path = "../../../xpute/core" }
pxl-spec = { path = "../../spec" }
pxl-render = { path = "../render" }
# The executor the door polls the kernel's tasks on inside a turn
# (door/executor.rs). No platform feature: the pender is the kernel's own, and
# the platform one for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"

[features]
# What a development build has and a published one does not: the settings
# schema.json marks `dev`, offered, and the frame gizmo they turn on. A
# published module is built without (pxl-wasm's `dev`, off by
# apps/web/script/build-wasm.ts): it offers no dev setting, each running at the
# default the JSON gives, and carries no gizmo.
default = ["dev"]
dev = []

[lints]
workspace = true
