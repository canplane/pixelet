# Its own workspace, and deliberately not a member of crates/: the server
# images copy `crates` alone, so a member reached from there through `..` is a
# path their build context does not contain.
[workspace]

[package]
name = "ingest-asset"
edition = "2021"
version = "0.0.0"
publish = false

# A crate and not a single-file cargo script, although it sits beside one
# (download_texture_pack.rs, which stays a script: it is run by hand and its
# HTTP client would be compiled by every gate for nothing). What a script cost
# once CI ran its test is the reason: a single-file package keeps its lock
# where a fresh runner cannot find it, so every run re-resolved the whole graph
# and `-Zscript` had CI installing a nightly toolchain for that alone. A
# manifest and a committed Cargo.lock beside it answer both on a stable
# toolchain.
[[bin]]
name = "ingest-asset"
path = "ingest_asset.rs"

[dependencies]
# A bucket key is the sha256 of an object's bytes.
sha2 = "0.10"
# The glb's own JSON chunk.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# libwebp itself, for the sheet. `image`'s own WebP support encodes lossless
# only, and the sheet is quality-92 lossy — 60 tiles of 256² lossless is
# several megabytes where this is 400 kB, and it is downloaded on every cold
# start. Same library sharp reaches through libvips.
webp = "0.3"
xpute-core = { path = "../../crates/xpute/core" }
# Both directions: the emitted table is laid out by the cell catalog's own
# channels, and the test reads back the table this writes.
pxl-spec = { path = "../../crates/pxl/spec" }
