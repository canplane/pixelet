# The project name is pinned so the volumes keep the names they were made
# under: compose derives it from the directory otherwise, and this file
# lived in infra/ before infra/local/ — pgdata-geo is several gigabytes of
# ingested data that must not be re-created under a new name.
name: infra

services:
  db-main:
    image: postgres:16
    container_name: ${DB_MAIN_CONTAINER}
    restart: always
    ports:
      - "${DB_MAIN_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_MAIN_USER}
      POSTGRES_PASSWORD: ${DB_MAIN_PASSWORD}
      POSTGRES_DB: ${DB_MAIN_NAME}
    volumes:
      - pgdata-main:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK}

  db-geo:
    image: postgis/postgis:16-3.4
    container_name: ${DB_GEO_CONTAINER}
    restart: always
    ports:
      - "${DB_GEO_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_GEO_USER}
      POSTGRES_PASSWORD: ${DB_GEO_PASSWORD}
      POSTGRES_DB: ${DB_GEO_NAME}
    volumes:
      - pgdata-geo:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK}

networks:
  pixelet-network:
    name: ${DOCKER_NETWORK}

volumes:
  pgdata-main:
  pgdata-geo:
