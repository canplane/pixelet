services:
  db-core:
    image: postgres:16
    container_name: ${CORE_DB_CONTAINER}
    restart: always
    ports:
      - '${CORE_DB_PORT}:5432'
    environment:
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_DB: ${CORE_DB_NAME}
    volumes:
      - pgdata-core:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK}

  db-geo:
    image: postgis/postgis:16-3.4
    container_name: ${GEO_DB_CONTAINER}
    restart: always
    ports:
      - '${GEO_DB_PORT}:5432'
    environment:
      POSTGRES_USER: ${GEO_DB_USER}
      POSTGRES_PASSWORD: ${GEO_DB_PASSWORD}
      POSTGRES_DB: ${GEO_DB_NAME}
    volumes:
      - pgdata-geo:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK}

networks:
  pixelet-network:
    name: ${DOCKER_NETWORK}

volumes:
  pgdata-core:
  pgdata-geo:
