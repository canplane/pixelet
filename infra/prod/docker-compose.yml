# infra/prod/docker-compose.yml
#
# The Hetzner VM's own stack — the search server plus the two Postgres
# instances it and its successor need (same DB_MAIN/DB_GEO split infra/local/docker-compose.yml already uses
# for local dev, kept identical here rather than consolidating into one
# Postgres server: same env var shape, same mental model, and Postgres's
# own idle footprint is small enough that two containers costs nothing
# real on a 4GB box). db-geo only ever holds overture_places/
# overture_division_areas/overture_divisions — see
# doc/minutes/20260908-overture-poi-adoption.md and the divisions/search
# provider files for why terrain's own ingestion tables (overture_buildings/
# overture_transportation/overture_base_*/elevation_raster) never
# belong here at all (terrain is baked offline, already static on R2 —
# this VM's Postgres has nothing to do with it).
#
# api has no published host port on purpose — only caddy talks to it, over
# this compose file's own internal network, so the raw HTTP port is never
# reachable from the public internet directly.
#
# Usage (on the VM, from this directory):
#   cp .env.example .env   # fill in real values, chmod 600 it
#   docker compose up -d --build

services:
  db-main:
    image: postgres:16
    container_name: pixelet-db-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MAIN_USER}
      POSTGRES_PASSWORD: ${DB_MAIN_PASSWORD}
      POSTGRES_DB: ${DB_MAIN_NAME}
    volumes:
      - pgdata-main:/var/lib/postgresql/data
    networks:
      - pixelet

  db-geo:
    image: postgis/postgis:16-3.4
    container_name: pixelet-db-geo
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_GEO_USER}
      POSTGRES_PASSWORD: ${DB_GEO_PASSWORD}
      POSTGRES_DB: ${DB_GEO_NAME}
    volumes:
      - pgdata-geo:/var/lib/postgresql/data
    networks:
      - pixelet

  # crates/geo, the world's data server
  # (doc/minutes/20260918-the-server-in-rust-and-the-line-already-drawn.md). The
  # service is still called `api` because that is the hostname Caddy proxies to
  # and renaming it is a restart of the stack for a word.
  api:
    build:
      context: ../..
      dockerfile: crates/server/geo/Dockerfile
    container_name: pixelet-api
    restart: unless-stopped
    depends_on:
      - db-geo
    environment:
      # db-geo alone: one server, one database. db-main is the app service's.
      DB_GEO_URL: postgresql://${DB_GEO_USER}:${DB_GEO_PASSWORD}@db-geo:5432/${DB_GEO_NAME}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      GEO_HOST: 0.0.0.0
      GEO_PORT: "3000"
    networks:
      - pixelet

  # crates/api. It answers nothing yet and is here for the same reason the
  # TypeScript's own db-main pool was: the shape a first route arrives into —
  # the root, the origin, the container and the secret — rather than one to be
  # assembled on the day it is written.
  app:
    build:
      context: ../..
      dockerfile: crates/server/api/Dockerfile
    container_name: pixelet-app
    restart: unless-stopped
    depends_on:
      - db-main
    environment:
      DB_MAIN_URL: postgresql://${DB_MAIN_USER}:${DB_MAIN_PASSWORD}@db-main:5432/${DB_MAIN_NAME}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: "3000"
    networks:
      - pixelet

  caddy:
    image: caddy:2-alpine
    container_name: pixelet-caddy
    restart: unless-stopped
    depends_on:
      - api
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pixelet

networks:
  pixelet:
    name: pixelet-prod

volumes:
  pgdata-main:
  pgdata-geo:
  caddy_data:
  caddy_config:
