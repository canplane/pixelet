[package]
name = "pxl-geo-bake"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
# `serve_tiles` only; off by default so the bake tools skip axum.
serve = ["dep:axum", "dep:tokio", "dep:pxl-server"]
# `ingest_overture` only; off by default so the bakes skip Arrow and Parquet.
ingest = ["dep:arrow", "dep:parquet"]

[dependencies]
fnv.workspace = true
libm.workspace = true
pxl-geo-spec.workspace = true
pxl-spec = { workspace = true, features = ["serde"] }
pxl-spec-core.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
# Blocking: the pack and rasterize are `Rc`-backed, so a page is one non-`Send`
# call, and each worker is a thread with its own connection.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
zstd = "0.13"
# The star catalog as CDS packs it (bin/bake_star.rs).
flate2 = "1"
# The Earth's picture: its sources are JPEG, its global form WebP.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
webp = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value`: jsonb keeps numbers as `numeric`, so re-rendering a parsed double
# changes the stored value. `float_roundtrip`: the default parser misrounded
# 227 of 10,979 longitudes by an ULP.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
axum = { version = "0.8", optional = true }
pxl-server = { workspace = true, optional = true }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "process", "time"], optional = true }
# Overture's GeoParquet, read into db-geo (bin/ingest_overture.rs).
arrow = { version = "60", default-features = false, optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }

# Declared because a feature gates it; the other bins are found in src/bin/.
[[bin]]
name = "serve_tiles"
required-features = ["serve"]

[[bin]]
name = "ingest_overture"
required-features = ["ingest"]
