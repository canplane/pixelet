[package]
name = "pxl-api"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pxl-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
pxl-server = { path = ".." }
pxl-spec = { path = "../../spec" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
