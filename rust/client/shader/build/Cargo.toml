[package]
name = "pxl-shader-build"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spirv-builder = "=0.10.0-alpha.1"
rustc_codegen_spirv = { version = "=0.10.0-alpha.1", default-features = false, features = ["use-compiled-tools"] }
# naga reads the SPIR-V here (main.rs `wgsl`): the workspace pin (Cargo.toml [patch.crates-io], gfx-rs/wgpu#10459), the runner's own.
naga = { version = "30", features = ["spv-in", "wgsl-out"] }
