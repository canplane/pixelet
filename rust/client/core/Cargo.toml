[package]
name = "pxl-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The core is its own artifact (lib.rs `link!`): the WebAssembly module a
# page instantiates (cdylib, pxl_core.wasm), the static library an iPhone
# app links (staticlib) and the shared one an Android app loads (cdylib).
# Each build asks cargo for the one it takes by name (`cargo rustc
# --crate-type`: ts/client/script/wasm-build.py,
# ts/client/script/core-build.py), so none makes the others.
[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
fnv.workspace = true
pxl-global.workspace = true
libm.workspace = true
xpute-link.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
# Whether the GPU's host takes a frame now (xpute_gpu_guest::admit::frame), which
# the renderer is told each frame (domain/scene/stage.rs).
xpute-gpu-guest.workspace = true
# The GPU's words both sides take: a program's settings and the stream's enums.
xpute-gpu-link.workspace = true
pxl-spec.workspace = true
pxl-engine.workspace = true
pxl-content.workspace = true
pxl-render.workspace = true
# The executor the link polls the core's tasks on inside an entry
# (sys/sched/executor.rs). No platform feature: the pender is the core's own, and
# the platform one for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"

# The core's native form off WebAssembly (xpute_guest::link!, lib.rs):
# its memory, its thread, the allocator over both, the stop hook and the C
# ABI with its JNI, which src/sys/unpack.rs reaches JNI's bindings through too;
# and the GPU's host that runs the renderer's stream on the device around
# each entry, as the page's runs it on WebGPU. Metal on an iPhone, Vulkan on
# Android; each backend compiles to nothing on the other's system.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xpute-gpu-native-host.workspace = true
# The host beside the core in the app's process: its thread, its link, and
# what it serves of pixelet's own (sys/runtime_abi.rs).
xpute-native-host.workspace = true
# The bodies the app's fetch hands over still zstd (src/sys/unpack.rs), read by
# libzstd, the format's reference implementation, as the bake writes them
# (pxl-geo-bake). C, built by each target's own compiler
# (ts/client/script/core-build.py). No defaults: RFC 8878's frame
# alone, none of the formats before it.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
# The records a test holds the core to beside the client
# (spec/golden/object/top.tsv).
xpute-golden.workspace = true
# The core's whole frames on a device (tests/frame/): the catalog's hex, and the device's
# error scopes, waited out without a runtime.
hex.workspace = true
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan"] }
pollster = "1"

[features]
# What a development build has and a published one does not: the settings
# schema.json marks `dev` — the nightly features — offered. A published
# module or device library is built without (`--no-default-features`, the
# release `args` of ts/client/package.json `xpute.guest`, which
# ts/client/script/wasm-build.py and core-build.py both read): it offers no
# dev setting, each running at the default the JSON gives.
default = ["dev"]
dev = []

[lints]
workspace = true
