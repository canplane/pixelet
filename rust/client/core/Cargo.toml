[package]
name = "pxl-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The core is its own artifact (lib.rs `core!`): the WebAssembly module a
# page instantiates (cdylib, pxl_core.wasm), the static library an iPhone
# app links (staticlib) and the shared one an Android app loads (cdylib).
# Each build asks cargo for the one it takes by name (`cargo rustc
# --crate-type`: ts/client/script/wasm-build.py,
# ts/client/script/core-build.py), so none makes the others.
[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
fnv.workspace = true
libm.workspace = true
xpute-core.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
# Whether the GPU's runtime takes a frame now (xpute_gpu::admit), which the
# renderer is told each frame (domain/scene/stage.rs).
xpute-gpu.workspace = true
pxl-spec.workspace = true
pxl-engine.workspace = true
pxl-content.workspace = true
pxl-render.workspace = true
# The executor the door polls the core's tasks on inside a turn
# (sys/sched/executor.rs). No platform feature: the pender is the core's own, and
# the platform one for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"

# The core's native form off WebAssembly (xpute_core::core!, lib.rs):
# its memory, its thread, the allocator over both, the stop hook and the C
# ABI with its JNI, which src/sys/unpack.rs reaches JNI's bindings through too;
# and the GPU's runtime that runs the renderer's stream on the device around
# each turn, as the page's runs it on WebGPU. Metal on an iPhone, Vulkan on
# Android; each backend compiles to nothing on the other's system.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xpute-runtime.workspace = true
xpute-gpu = { workspace = true, features = ["runtime"] }
# The bodies the app's fetch hands over still zstd (src/sys/unpack.rs), read by
# libzstd, the format's reference implementation, as the bake writes them
# (pxl-geo-bake). C, built by each target's own compiler
# (ts/client/script/core-build.py). No defaults: RFC 8878's frame
# alone, none of the formats before it.
zstd = { version = "0.13", default-features = false }

# The module's link arguments, from the core's manifest (build.rs,
# xpute_core::wasm `link`).
[build-dependencies]
xpute-core.workspace = true

[dev-dependencies]
# The records a test holds the core to beside the client
# (spec/golden/object/top.tsv).
xpute-kit = { workspace = true, features = ["std", "golden"] }
# The core's whole frames on a device (tests/frame/): the protocols' JSON they speak by,
# the catalog's hex, and the device's error scopes, waited out without a runtime.
serde_json = "1"
hex.workspace = true
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan"] }
pollster = "1"

[features]
# What a development build has and a published one does not: the settings
# schema.json marks `dev` — the nightly features — offered. A published
# module or device library is built without (`--no-default-features`, by
# ts/client/script/wasm-build.py, and for a Release by
# ts/client/script/core-build.py from ts/client/package.json): it
# offers no dev setting, each running at the default the JSON gives.
default = ["dev"]
dev = []

[lints]
workspace = true

# The core's whole frames (tests/frame/), a program of their own: one core a process, its
# turns run by the program alone, and a clock of its own that ends the process on a hang.
[[test]]
name = "frame"
path = "tests/frame/main.rs"
harness = false
