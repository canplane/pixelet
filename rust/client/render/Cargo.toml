[package]
name = "pxl-render"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
libm.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
pxl-spec.workspace = true
# The GPU's decor pass's bounds and the record it writes (gpu/renderer.rs);
# the cloud field the sheets lie on (gpu/cloud.rs), pixelet's content.
pxl-engine.workspace = true
pxl-content.workspace = true

# WebGPU's calls written into a stream (gpu/api.rs): xpute's encoder, which
# the page's host and the device app's run alike.
xpute-gpu.workspace = true

[build-dependencies]
# The light a color decodes to, the same bits on every machine (build.rs
# `debug_looks`), as the crate's own is (clippy.toml).
libm.workspace = true
# The zooms the screen's rays are painted by (build.rs `lattice.wgsl`) and the
# values every shader may name (`words`); the cloud field's hash
# (`cloud_hash.wgsl`), pixelet's content.
pxl-engine.workspace = true
pxl-content.workspace = true
# The hash's words (build.rs `world_word`).
xpute-kit.workspace = true
# Every shader validated, and what its stages read, as it is built (build.rs `assemble`).
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
# The moon's shipped map read back, so its mean holds `MOON_MAP_MEAN`
# (frame/shader/word.test.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
# The walks by hand run on a device against `cast::walk` (tests/walk.rs).
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "naga-ir"] }
pollster = "1"

[lints]
workspace = true
