[package]
name = "pxl-render"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
libm.workspace = true
pxl-global.workspace = true
xpute-link.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
pxl-spec.workspace = true
# The GPU's decor pass's bounds and the record it writes (renderer.rs);
# the cloud field the sheets lie on (pass/cloud.rs) and where night falls
# (look/environment.rs), pixelet's content.
pxl-engine.workspace = true
pxl-content.workspace = true

# WebGPU's calls written into a stream (gpu/api.rs): xpute's encoder, which
# the page's host and the device app's run alike.
xpute-gpu-guest.workspace = true
# The stream's words, which the encoder writes and its hosts read.
xpute-gpu-link.workspace = true

[build-dependencies]
# The root a shader constant takes, the same bits on every machine (build/shared.rs
# `HORIZON_TO_TOP_KM`), as the crate's own is; look/atmosphere.rs, which build.rs
# compiles, calls it too.
libm.workspace = true
# The values and small functions the shaders share with the engine, pixelet's
# content and the world (build/shared.rs): the values every shader may name
# (`constant`), the zoom the screen's rays are painted by (`ray`), the cloud
# field's hash (`cloud_hash`) and where night falls.
pxl-engine.workspace = true
pxl-content.workspace = true
pxl-spec.workspace = true
# The hash's words (build/shared.rs `world_word`).
xpute-kit.workspace = true
# Every shader validated, and what its stages read, as it is built (build.rs `assemble`).
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
# The moon's shipped map read back, so its mean holds `MOON_MAP_MEAN`
# (frame/shader/word.test.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
# The passes by hand run on a device against pxl-engine (tests/).
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "naga-ir"] }
pollster = "1"
# The worlds the frame schedule reaches, kept as they are explored (ray/schedule.test.rs).
fnv.workspace = true

[lints]
workspace = true
