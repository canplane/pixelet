[package]
name = "pxl-render"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
fnv.workspace = true
libm.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
pxl-spec.workspace = true
# The GPU's decor pass's bounds and the record it writes (gpu/renderer.rs),
# and the cloud field the sheets lie on (gpu/cloud.rs).
pxl-spec-core.workspace = true

# WebGPU's calls written into a stream (gpu/api.rs): xpute's encoder, which
# the page's host and the device app's run alike.
xpute-gpu.workspace = true

[build-dependencies]
# The light a color decodes to, the same bits on every machine (build.rs
# `debug_looks`), as the crate's own is (clippy.toml).
libm.workspace = true
# The zooms the screen's rays are painted by (build.rs `lattice.wgsl`), the
# cloud field's hash (`cloud_hash.wgsl`), and the values every shader may
# name (`words`).
pxl-spec-core.workspace = true
# Every shader validated, and what its stages read, as it is built (build.rs `assemble`).
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
# The Moon's shipped map read back, so its mean holds `sky::moon::MAP_MEAN`
# (param.test.rs).
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
