[package]
name = "pxl-kernel"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
base64.workspace = true
fnv.workspace = true
libm.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
pxl-spec.workspace = true
pxl-spec-core.workspace = true
pxl-render.workspace = true
# The executor the door polls the kernel's tasks on inside a turn
# (door/executor.rs). No platform feature: the pender is the kernel's own, and
# the platform one for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"

[features]
# What a development build has and a published one does not: the settings
# schema.json marks `dev` — the nightly features — offered. A published module
# is built without (pxl-wasm's `dev`, off by ts/app/web/script/build-wasm.py,
# and pxl-native's for a Release by ts/app/native/script/build-native.py): it
# offers no dev setting, each running at the default the JSON gives.
default = ["dev"]
dev = []

[lints]
workspace = true
