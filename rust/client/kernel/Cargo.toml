[package]
name = "pxl-kernel"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The kernel is its own artifact (lib.rs `guest!`): the WebAssembly module a
# page instantiates (cdylib, pxl_kernel.wasm), the static library an iPhone
# app links (staticlib) and the shared one an Android app loads (cdylib).
# Each build asks cargo for the one it takes by name (`cargo rustc
# --crate-type`: ts/client/script/build-wasm.py,
# xpute/ts/native/script/build-core.py), so none makes the others.
[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
fnv.workspace = true
libm.workspace = true
xpute-guest.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
# Whether the GPU's host takes a frame now (xpute_gpu::admit), which the
# renderer is told each frame (domain/scene/stage.rs).
xpute-gpu.workspace = true
pxl-spec.workspace = true
pxl-engine.workspace = true
pxl-content.workspace = true
pxl-render.workspace = true
# The executor the door polls the kernel's tasks on inside a turn
# (door/executor.rs). No platform feature: the pender is the kernel's own, and
# the platform one for wasm brings wasm-bindgen.
embassy-executor = { version = "0.10", default-features = false }
critical-section = "1.1"

# The kernel's native form off WebAssembly (xpute_guest::guest!, lib.rs):
# its memory, its thread, the allocator over both, the stop hook and the C
# ABI with its JNI, which src/unpack.rs reaches JNI's bindings through too;
# and the GPU's host that runs the renderer's stream on the device around
# each turn, as the page's runs it on WebGPU. Metal on an iPhone, Vulkan on
# Android; each backend compiles to nothing on the other's system.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xpute-host.workspace = true
xpute-gpu = { workspace = true, features = ["host"] }
# The bodies the app's fetch hands over still zstd (src/unpack.rs), read by
# libzstd, the format's reference implementation, as the bake writes them
# (pxl-geo-bake). C, built by each target's own compiler
# (xpute/ts/native/script/build-core.py). No defaults: RFC 8878's frame
# alone, none of the formats before it.
zstd = { version = "0.13", default-features = false }

# The module's link arguments, from the kernel's machine (build.rs,
# xpute_guest::wasm `link`).
[build-dependencies]
xpute-guest.workspace = true

[dev-dependencies]
# The records a test holds the kernel to beside the client
# (spec/golden/object/top.tsv).
xpute-kit = { workspace = true, features = ["std", "golden"] }

[features]
# What a development build has and a published one does not: the settings
# schema.json marks `dev` — the nightly features — offered. A published
# module or device library is built without (`--no-default-features`, by
# ts/client/script/build-wasm.py, and for a Release by
# xpute/ts/native/script/build-core.py from ts/client/package.json): it
# offers no dev setting, each running at the default the JSON gives.
default = ["dev"]
dev = []

[lints]
workspace = true
