[package]
name = "pxl-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The device's library (lib.rs): the core linked with what xpute's runtime
# starts it with, as ts/client/src/runtime/worker.ts is a page's. An iPhone app links it static (staticlib), an Android app loads it
# shared (cdylib); the device's build asks cargo for the one it takes by name
# (`cargo rustc --crate-type`, ts/client/script/core-build.py).
[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The guest, linked into the library as a page instantiates its module.
pxl-core.workspace = true
# The device's GPU settings and the text's color (lib.rs, text.rs).
pxl-render.workspace = true
pxl-spec.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
xpute-link.workspace = true
pxl-gpu-link.workspace = true
# The runtime the core runs in on a device, what its host implements, and the
# GPU's host that runs the renderer's stream around each entry, as the page's
# runs it on WebGPU. Metal on an iPhone, Vulkan on Android; each backend
# compiles to nothing on the other's system.
xpute-runtime-native.workspace = true
xpute-host.workspace = true
pxl-gpu-host.workspace = true
# The bodies the app's fetch hands over still zstd (src/unpack.rs), read by
# libzstd, the format's reference implementation, as the bake writes them
# (pxl-geo-bake). C, built by each target's own compiler
# (ts/client/script/core-build.py). No defaults: RFC 8878's frame
# alone, none of the formats before it.
zstd = { version = "0.14", default-features = false }

[features]
# The core's development build (pxl-core `dev`), which a published library is
# built without (`--no-default-features`, ts/client/package.json
# `xpute.guest`).
default = ["dev"]
dev = ["pxl-core/dev"]

[lints]
workspace = true
