[package]
name = "pxl-tool"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

# No crate a generator writes into is a dependency: the generators must build
# when that output is broken.
[dependencies]
# The generators are xpute's, handed pixelet's tables (spec/cmd.rs, spec/data.rs).
xpute-gen = { path = "../../xpute/gen" }
xpute-link-gen = { path = "../../xpute/link/gen" }
# xpute and its GPU plugin declare their targets.
xpute-gen-targets = { path = "../../xpute/gen-targets" }
xpute-gpu-gen-targets = { path = "../../xpute/gpu/gen-targets" }
fnv.workspace = true
libm.workspace = true
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
regex = "1"
# `image` encodes WebP lossless only; the pack is lossy q92.
webp = "0.3"
# Carto's symbols are SVG; rasterized once, at ingest, into the masks the atlas draws.
resvg = { version = "0.45", default-features = false }
ureq = "2"
# Half the size of `image`'s JPEG encoder for the link preview.
mozjpeg = "0.10"


[lints]
workspace = true
