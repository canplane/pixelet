# Which Rust this checkout is, for rustup to read — locally, in CI and in an
# editor alike. It is pinned to the patch, not the minor, so that a toolchain
# release cannot turn a clippy lint on under us: `1.100` would let 1.100.1 in.
#
# The version is written in three places, which change together: here,
# xpute/rust-toolchain.toml, and the server images' base tags
# (rust/server/geo/Dockerfile, rust/server/api/Dockerfile), since an image's
# tag is chosen before anything in its build context can be read.
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-src", "rust-analyzer"]
# The module's target, and a device's: an iPhone and the simulator on an
# Apple silicon Mac, and an Android phone and the emulator on one
# (pxl-core's library).
targets = ["wasm32-unknown-unknown", "aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android"]
