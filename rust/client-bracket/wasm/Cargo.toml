[package]
name = "pxl-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
# The module links against an imported memory and the shell's imports; it has
# no native test binary. Its tests are pxl-kernel's and xpute-kit's.
test = false
doctest = false

[dependencies]
xpute-kit = { path = "../../../xpute/rust/kit" }
xpute-guest = { path = "../../../xpute/rust/guest" }
pxl-kernel = { path = "../../client/kernel", default-features = false }

[features]
# Forwarded to the kernel. On for a module anyone works on; the published one
# is built `--no-default-features` (ts/app/web/script/build-wasm.ts) and
# carries no dev-only setting.
default = ["dev"]
dev = ["pxl-kernel/dev"]

[lints]
workspace = true

# The module's link flags, with mem.json's numbers (build.rs).
[build-dependencies]
xpute-link = { path = "../../../xpute/rust/link" }
