# The workspace's own commands, run from rust/ as the root's tasks do, so
# rustup reads rust-toolchain.toml beside them: what a check holds a change
# to, what the tests run, the generator, and the binaries that make the data
# and serve a dev run.
[alias]
# The module as it ships, in both builds, and the servers with their tests' code.
lint-core = ["clippy", "--target", "wasm32-unknown-unknown", "-p", "pxl-spec", "-p", "pxl-gpu-link", "-p", "pxl-gpu-guest", "-p", "pxl-render", "-p", "pxl-core", "--", "-D", "warnings"]
lint-core-published = ["clippy", "--target", "wasm32-unknown-unknown", "-p", "pxl-core", "--no-default-features", "--", "-D", "warnings"]
lint-server = ["clippy", "--all-targets", "-p", "pxl-geo-spec", "-p", "pxl-server", "-p", "pxl-geo", "-p", "pxl-api", "--", "-D", "warnings"]
# What runs here alone: the tests' code, the bakes (the tile server's feature
# with them, which only adds) and the tools.
lint-host = ["clippy", "--all-targets", "-p", "pxl-spec", "-p", "pxl-gpu-link", "-p", "pxl-gpu-guest", "-p", "pxl-gpu-host", "-p", "pxl-engine", "-p", "pxl-content", "-p", "pxl-render", "-p", "pxl-core", "-p", "pxl-geo-bake", "-p", "pxl-tool", "--features", "pxl-geo-bake/serve,pxl-geo-bake/ingest", "--", "-D", "warnings"]
# The native library, the core with its runtime and the GPU's host, for an
# iPhone and an Android phone, as a release builds it.
lint-ios = ["clippy", "--target", "aarch64-apple-ios", "-p", "pxl-gpu-host", "-p", "pxl-runtime", "--no-default-features", "--", "-D", "warnings"]
# Clippy misreads std's Android thread-local expansion: os-based TLS drops the `const` block,
# so the lint fires on const initializers no code can satisfy. The allow covers no code of
# ours: each `thread_local!` here that can initialize in a `const` block already does, as the
# lint asks, and it fires on those alike under the toolchain rust-toolchain.toml pins. The
# flag goes when `cargo lint-android` passes without it.
lint-android = ["clippy", "--target", "aarch64-linux-android", "-p", "pxl-gpu-host", "-p", "pxl-runtime", "--no-default-features", "--", "-D", "warnings", "-A", "clippy::missing_const_for_thread_local"]
# pxl-tool holds every model to the committed table.
test-host = ["test", "-p", "pxl-spec", "-p", "pxl-engine", "-p", "pxl-content", "-p", "pxl-geo-spec", "-p", "pxl-server", "-p", "pxl-geo", "-p", "pxl-geo-bake", "-p", "pxl-api", "-p", "pxl-tool", "--features", "pxl-geo-bake/serve"]
# pxl-core's unit tests.
test-core = ["nextest", "run", "-p", "pxl-core", "--lib"]
# The renderer's own tests here, and its passes on this machine's GPU, held to
# pxl-engine word for word (tests/).
test-render = ["test", "-p", "pxl-render", "--lib"]
test-gpu = ["test", "-p", "pxl-render", "--test", "*"]
# The GPU's crates: the golden programs, run on this machine's GPU through the
# device's host, and the host's own tests on a wgpu adapter.
test-gpu-host = ["test", "-p", "pxl-gpu-link", "-p", "pxl-gpu-guest", "-p", "pxl-gpu-host"]
# The code generated from spec/: `cargo spec` says what is stale, `cargo spec --write` writes it.
spec = ["run", "-q", "-p", "pxl-tool", "--bin", "spec", "--"]
# What the tree must keep that no compiler sees (pxl-tool bin/rule.rs).
check-rules = ["run", "-q", "-p", "pxl-tool", "--bin", "rule", "--"]

# The binaries that make the repository's data and the servers a dev run
# starts, each with its profile and features: `server` where a debug build is
# felt on every tile, `release` for one long run. Each works in the checkout's
# root wherever it is started. The ones that read the databases or are servers
# want the local environment, which the root's make gives them
# (script/env.sh): `make bake-terrain ARGS="--step leaf"`.
bake-terrain = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "terrain", "--"]
bake-place = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "place", "--"]
bake-division = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "division", "--"]
bake-imagery = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "imagery", "--"]
bake-star = ["run", "-p", "pxl-geo-bake", "--bin", "star", "--"]
bake-geoid = ["run", "--profile", "release", "-p", "pxl-tool", "--bin", "geoid", "--"]
# Every Overture type into db-geo, a shard at a time (infra/geo/README.md).
ingest-overture = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--features", "ingest", "--bin", "overture", "--"]
download-pack = ["run", "-p", "pxl-tool", "--bin", "download", "--", "pack"]
download-moon = ["run", "-p", "pxl-tool", "--bin", "download", "--", "moon"]
download-imagery = ["run", "-p", "pxl-tool", "--bin", "download", "--", "imagery"]
download-star = ["run", "-p", "pxl-tool", "--bin", "download", "--", "star"]
# After any change under asset/content/.
ingest-asset = ["run", "-p", "pxl-tool", "--bin", "asset", "--"]
# The symbol's outline both apps bundle, when ts/client/brand's symbol changes;
# the page's icons are made by its build (ts/client build:brand).
render-brand = ["run", "-p", "pxl-tool", "--bin", "brand", "--", "--symbol"]
serve-geo = ["run", "--profile", "server", "-p", "pxl-geo", "--bin", "pxl-geo", "--"]
serve-api = ["run", "--profile", "server", "-p", "pxl-api", "--bin", "pxl-api", "--"]
# The dev tile server, its sets baked on demand or off the shelf.
serve-tile = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--features", "serve", "--bin", "server", "--"]

# Every rustc a build runs, through the machine's compile cache where it has
# one (.cargo/rustc.sh); relative to rust/, where this .cargo is.
[build]
rustc-wrapper = ".cargo/rustc.sh"

# The repository's root, for what a crate reads beyond its own directory: a
# file is named from here, never counted out from where the crate is.
[env]
PXL_REPO = { value = "..", relative = true }
