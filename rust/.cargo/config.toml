# The workspace's own commands, run from rust/ as the root's tasks do, so
# rustup reads rust-toolchain.toml beside them: what a check holds a change
# to, what the tests run, the generator, and the binaries that make the data
# and serve a dev run.
[alias]
# The module as it ships, in both builds, and the servers with their tests' code.
lint-guest = ["clippy", "--target", "wasm32-unknown-unknown", "-p", "pxl-spec", "-p", "pxl-render", "-p", "pxl-kernel", "-p", "pxl-wasm", "--", "-D", "warnings"]
lint-guest-published = ["clippy", "--target", "wasm32-unknown-unknown", "-p", "pxl-wasm", "--no-default-features", "--", "-D", "warnings"]
lint-server = ["clippy", "--all-targets", "-p", "pxl-geo-spec", "-p", "pxl-server", "-p", "pxl-geo", "-p", "pxl-api", "--", "-D", "warnings"]
# What runs here alone: the tests' code, the bakes (the tile server's feature
# with them, which only adds) and the tools.
lint-host = ["clippy", "--all-targets", "-p", "pxl-spec", "-p", "pxl-spec-core", "-p", "pxl-render", "-p", "pxl-kernel", "-p", "pxl-geo-bake", "-p", "pxl-tool", "--features", "pxl-geo-bake/serve", "--", "-D", "warnings"]
# The device's library, for an iPhone and an Android phone.
lint-ios = ["clippy", "--target", "aarch64-apple-ios", "-p", "pxl-native", "--", "-D", "warnings"]
lint-android = ["clippy", "--target", "aarch64-linux-android", "-p", "pxl-native", "--no-default-features", "--", "-D", "warnings"]
# pxl-tool holds every model to the committed table, which has been wrong by hand before.
test-host = ["test", "-p", "pxl-spec", "-p", "pxl-spec-core", "-p", "pxl-render", "-p", "pxl-kernel", "-p", "pxl-geo-spec", "-p", "pxl-server", "-p", "pxl-geo", "-p", "pxl-geo-bake", "-p", "pxl-api", "-p", "pxl-tool"]
test-kernel-published = ["test", "-p", "pxl-kernel", "--no-default-features"]
test-bake-serve = ["test", "-p", "pxl-geo-bake", "--features", "serve"]
# The code generated from spec/: `cargo spec` says what is stale, `cargo spec --write` writes it.
spec = ["run", "-q", "-p", "pxl-tool", "--bin", "spec", "--"]

# The binaries that make the repository's data and the servers a dev run
# starts, each with its profile and features: `server` where a debug build is
# felt on every tile, `release` for one long run. Each works in the checkout's
# root wherever it is started. The ones that read the databases or are servers
# want the local environment, which the root's make gives them
# (script/with-env.sh): `make bake-terrain ARGS="--stage leaf"`.
bake-terrain = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "bake_terrain", "--"]
bake-place = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "bake_place", "--"]
bake-division = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "bake_division", "--"]
bake-earth = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--bin", "bake_earth", "--"]
bake-star = ["run", "-p", "pxl-geo-bake", "--bin", "bake_star", "--"]
bake-geoid = ["run", "--profile", "release", "-p", "pxl-tool", "--bin", "bake_geoid", "--"]
download-pack = ["run", "-p", "pxl-tool", "--bin", "download_texture_pack", "--"]
download-moon = ["run", "-p", "pxl-tool", "--bin", "download_moon", "--"]
download-earth = ["run", "-p", "pxl-tool", "--bin", "download_earth", "--"]
download-star = ["run", "-p", "pxl-tool", "--bin", "download_star", "--"]
# After any change under asset/content/.
ingest-asset = ["run", "-p", "pxl-tool", "--bin", "ingest_asset", "--"]
# The symbol's outline both apps bundle, when ts/client/brand's symbol changes;
# the page's icons are made by its build (ts/app/web build:brand).
render-brand = ["run", "-p", "pxl-tool", "--bin", "render_brand", "--", "--symbol"]
serve-geo = ["run", "--profile", "server", "-p", "pxl-geo", "--bin", "pxl-geo", "--"]
serve-api = ["run", "--profile", "server", "-p", "pxl-api", "--bin", "pxl-api", "--"]
# The dev tile server, its sets baked on demand or off the shelf.
serve-tile = ["run", "--profile", "server", "-p", "pxl-geo-bake", "--features", "serve", "--bin", "serve_tiles", "--"]

# The repository's root, for what a crate reads beyond its own directory: a
# file is named from here, never counted out from where the crate is.
[env]
PXL_REPO = { value = "..", relative = true }
