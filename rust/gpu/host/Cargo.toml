[package]
name = "pxl-gpu-host"
description = "The GPU's host on a native device: it runs the records the guest writes on wgpu"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pxl-gpu-link.workspace = true
xpute-link.workspace = true
xpute-kit = { workspace = true, features = ["std"] }
# It serves the GPU's bindings (src/abi.rs) on the host's side, on
# the guest's thread, and hands a job's result back there (native.rs).
xpute-host.workspace = true
# The pipelines being made, by the guest's handle (lib.rs).
fnv.workspace = true
# wgpu runs the records, its serde names read the spec's, and an external
# image is decoded here where the web asks its browser.
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "serde"] }
serde = "1"
png = "0.18"
image-webp = "0.2"
zune-jpeg = "0.5"
# This waits out the adapter's and the device's futures as a device opens
# (`open`), which wgpu resolves at once on a native backend, so no async runtime
# is needed.
pollster = "1"

# A view's `Surface` crosses as the native window wgpu draws through
# (src/jni.rs `bind`, native.rs `Window`): the NDK's and JNI's own headers as
# bindings.
[target.'cfg(target_os = "android")'.dependencies]
# 0.3, the version ndk-sys 0.6 requires.
jni-sys = "0.3"
ndk-sys = "0.6"

[dev-dependencies]
# The tests take the golden records' reader.
xpute-golden.workspace = true
# The tests' guest memory is the runtime's, as an app's is (src/lib.test.rs).
xpute-runtime-native.workspace = true
# This is a device with no GPU under it, which makes and maps buffers but runs
# nothing. The host's CPU tests stage their writes on it
# (src/lib.noop.test.rs).
wgpu = { version = "30", default-features = false, features = ["noop"] }

[lints]
workspace = true
