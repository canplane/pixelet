[package]
name = "pxl-spec"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
# The shapes both servers answer with, as serde types. The kernel compiles
# this crate to wasm and reads a page through xpute's own codec, so it takes
# neither serde nor the weight of it.
serde = ["dep:serde"]

[dependencies]
fnv.workspace = true
libm.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
xpute-kit = { workspace = true, features = ["std"] }
pxl-spec-core.workspace = true

[dev-dependencies]
hex.workspace = true
serde = { version = "1", features = ["derive"] }
xpute-kit = { workspace = true, features = ["std", "golden"] }
