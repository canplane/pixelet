# Monthly refresh of the Overture-baked POI and reverse-geocode static
# sets — see issue/20260908-overture-poi-adoption.md for why this
# exists and how it's designed (short-cache-control stable prefixes,
# overwritten in place, rather than terrain's own immutable-versioned
# convention: POI/geocode staleness is cheap, a monthly redeploy to bump a
# version prefix every time would not be).
#
# Deliberately needs no terrain infrastructure in CI: the only thing this
# reuses from that pipeline is land_pages.json (which page_idx values are
# land, not ocean), fetched from a stable R2 object (_meta/land_pages.json)
# rather than rebuilding the classification here. Re-upload that object by
# hand (the publish-bucket skill's terrain step) if terrain's own land/ocean
# classification is ever rebuilt.
name: Overture monthly refresh

on:
  schedule:
    # 03:00 UTC on the 1st of each month — Overture's own releases land on
    # no fixed schedule, so this is "check monthly", not "the day a new one
    # ships".
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pixelet_geo
          POSTGRES_PASSWORD: pixelet_geo
          POSTGRES_DB: pixelet_geo
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_GEO_URL: postgres://pixelet_geo:pixelet_geo@localhost:5433/pixelet_geo
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bake's toolchain is rust-toolchain.toml's, which a bare install
      # reads. nightly is named because the ingests are single-file cargo
      # scripts, which is nightly-only; their shebang asks for it by name
      # (`cargo +nightly -Zscript`) and that override beats the file.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/target
          key: rust-bake-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: rust-bake-

      - name: Configure R2 credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}" --profile r2
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}" --profile r2
          aws configure set region auto --profile r2

      - name: Fetch land_pages.json (terrain's own land/ocean classification, not regenerated here)
        run: |
          mkdir -p out/terrain
          aws s3 cp "s3://pixelet-tiles/_meta/land_pages.json" out/terrain/land_pages.json \
            --profile r2 --endpoint-url "$R2_ENDPOINT"

      - name: Ingest Overture Places + Divisions (Korea)
        run: |
          ./infra/geo/overture/script/ingest_places.rs
          ./infra/geo/overture/script/ingest_divisions.rs

      # The POI page is an XTP packet (crates/pxl/spec/src/bake/format.rs,
      # encode_poi_page) since v3; the version here must match
      # PUBLISHED_VERSION.poi in spec/pxl/spec/bake/published.json.
      #
      # The `server` profile rather than release: a profile belongs to the
      # workspace root and release is the module's, which aborts on panic — one
      # bad page would end the whole bake with nothing written
      # (crates/Cargo.toml). --force because a monthly refresh is a full
      # rewrite, not a resume.
      - name: Bake POI
        run: deno task bake:poi --out ./out/poi/v3 --force

      - name: Bake reverse geocode
        run: deno task bake:geocode --out ./out/geocode/v1 --force

      # The same syncs as the publish-bucket skill's POI/geocode step — keep
      # the two in step.
      - name: Publish to R2
        run: |
          aws s3 sync ./out/poi/v3 s3://pixelet-tiles/poi/v3 \
            --profile r2 --endpoint-url "$R2_ENDPOINT" \
            --exclude "*.empty" --exclude "*.part" \
            --content-type application/octet-stream --content-encoding gzip \
            --cache-control "public, max-age=86400" --delete

          aws s3 sync ./out/geocode/v1 s3://pixelet-tiles/geocode/v1 \
            --profile r2 --endpoint-url "$R2_ENDPOINT" \
            --exclude "*.empty" --exclude "*.part" \
            --content-type application/json --content-encoding gzip \
            --cache-control "public, max-age=86400" --delete
