# What a job that builds the Rust needs before its first cargo command: the
# toolchain, Binaryen, and the caches. One action, so the jobs that build
# cannot drift apart in it.

name: toolchain
description: The Rust toolchain, Binaryen and the cargo and deno caches.

inputs:
  cache:
    description: >-
      The cargo cache's name. Each job keeps its own, so a job restores only
      what it built: the publish job once restored the gate's whole target
      directory and filled the runner's disk.
    required: true
  binaryen-version:
    description: The pinned Binaryen release (the workflow's BINARYEN_VERSION).
    required: true

runs:
  using: composite
  steps:
    # No version, no components, no target: rust-toolchain.toml names all
    # three and a bare install reads it. A step of its own rather than left
    # to the first cargo command, so that a toolchain that cannot be fetched
    # fails here, where the log says what happened.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    - name: Install Binaryen
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
      run: |
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar xz -C /opt
        echo "/opt/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

    # Keyed on the lockfiles, so a run that changed no dependency restores
    # exactly and a run that changed one still starts from the nearest
    # earlier tree rather than from nothing.
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          crates/target
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('crates/Cargo.lock') }}
        restore-keys: ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/deno
          node_modules
          apps/web/node_modules
        key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
        restore-keys: deno-${{ runner.os }}-
