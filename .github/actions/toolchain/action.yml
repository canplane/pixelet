# What a job that builds the Rust needs before its first cargo command: the
# toolchain, Binaryen, and the cargo cache. One action, so the jobs that build
# cannot drift apart in it.

name: toolchain
description: The Rust toolchain, Binaryen and the cargo cache.

inputs:
  cache:
    description: >-
      The cargo cache's name. Each job keeps its own, so a job restores only
      what it built.
    required: true
  binaryen-version:
    description: The pinned Binaryen release (the workflow's BINARYEN_VERSION).
    required: true

runs:
  using: composite
  steps:
    # The version is rust/rust-toolchain.toml's; the components and the
    # target are the ones a job builds with, fewer than the file names for a
    # checkout. A step of its own rather than left to the first cargo command,
    # so that a toolchain that cannot be fetched fails here, where the log says
    # what happened. The job then runs
    # every cargo under it whatever its directory (RUSTUP_TOOLCHAIN): a cargo
    # outside rust/ would otherwise take the runner's own stable.
    - name: Install the Rust toolchain
      shell: bash
      working-directory: rust
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

    - name: Install Binaryen
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
      run: |
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar xz -C /opt
        echo "/opt/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

    # The registry and the dependencies' builds, not the workspace's own,
    # which every run rebuilds anyway; keyed on the lockfile and the toolchain.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust -> target
        shared-key: ${{ inputs.cache }}
