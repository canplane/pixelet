# packages/pxl/render/rust/Cargo.toml

[package]
name = "pxl-render"
version = "0.1.0"
edition = "2024"

[dependencies]
pxl-spec = { path = "../../spec/rust" }
xpute-core = { path = "../../../xpute/core/rust" }
xpute-spec = { path = "../../../xpute/spec/rust" }
wgpu = { version = "23", features = ["webgpu"] }

[dependencies.web-sys]
version = "0.3"
features = ["OffscreenCanvas"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
