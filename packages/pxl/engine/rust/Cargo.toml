# packages/pxl/engine/rust/Cargo.toml

[package]
name = "pxl-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
client = []
server = []
render = ["dep:pxl-render"]

[dependencies]
pxl-bake = { path = "../../bake/rust", optional = true }
pxl-render = { path = "../../render/rust", optional = true }
pxl-spec = { path = "../../spec/rust" }
xpute-core = { path = "../../../xpute/core/rust" }
xpute-spec = { path = "../../../xpute/spec/rust" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
futures = { version = "0.3", default-features = false }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"