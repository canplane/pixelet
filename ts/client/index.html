<!doctype html>
<!-- The page's template: script/web.ts puts in the site's URL and the
     UI's ground and writes it to public/index.html, which Expo's web
     build fills with the bundle's script (app.config.ts). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: the world-cube symbol, rastered from ts/client/brand/ into
         /brand/ by the build. The ICO carries 16/32/48 as PNG entries; there
         is no vector of the symbol, so no SVG icon. The manifest's icon srcs
         are absolute and include the /brand/ prefix: bare
         /web-app-manifest-*.png 404s, so an installed Android shortcut had no
         icon at all. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      href="/brand/web-app-manifest-192x192.png"
      type="image/png"
      sizes="192x192"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Near the black the map shows: Android paints its browser chrome
         with this. -->
    <meta name="theme-color" content="#080c0f" />

    <!--
      viewport-fit=cover: lets content reach under the notch and home
      indicator, which is also the prerequisite for env(safe-area-inset-*)
      to report anything but zero.

      No interactive-widget=resizes-content, deliberately. It does keep the
      overlays on screen when the keyboard opens — by shrinking the layout
      viewport — but the canvas is sized off that same viewport, so the 3D
      view resized and reframed itself every time the keyboard appeared.
      Holding the layout viewport still keeps the world where it was, and the
      overlays are repositioned instead, from visualViewport (see
      src/viewport.ts). One mechanism rather than two that disagree.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>pixelet</title>
    <meta
      name="description"
      content="Find a real place and stack blocks on it."
    />

    <!-- Open Graph / Twitter link-preview card. Static, not run through
         t() — a crawler reads this HTML as-served and never executes the
         client bundle, so there is no language to switch on. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="pixelet" />
    <meta
      property="og:description"
      content="Find a real place and stack blocks on it."
    />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pixelet" />
    <meta
      name="twitter:description"
      content="Find a real place and stack blocks on it."
    />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-image.jpg" />
  </head>
  <body>
    <!-- The UI's ground until it mounts, which replaces this. -->
    <div id="root">
      <div style="flex: 1; background-color: %GROUND%"></div>
    </div>
  </body>
</html>
