// @pxl/app/modules/platform/android/build.gradle
//
// The device's half of the app's platform on Android, in src/main/java/.
// xpute's module (@xpute/native) builds and packs the core.

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'me.plei.pixelet'
version = '0.0.0'

android {
  namespace "me.plei.pixelet.platform"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.16.0'
}

