// @pxl/client/modules/platform/android/build.gradle
//
// The native half of the app's platform on Android, in src/main/java/.
// This module numbers the source paths a release's core holds, in the
// library xpute's module builds (script/number-paths.py).

import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'me.plei.pixelet'
version = '0.0.0'

// The app is the directory over its android/.
def app = rootProject.projectDir.parentFile

android {
  namespace "me.plei.pixelet.platform"
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.16.0'
}

// xpute's module is read first, for the task that builds the core.
evaluationDependsOn(':xpute-expo')
def xpute = project(':xpute-expo')
def guest = new JsonSlurper().parse(new File(app, "package.json")).xpute.guest

// The numbering runs on every release build, between the core's build and
// its packing: over paths already numbered it changes nothing, and the table
// of the run that numbered them stands. It asks cargo for the workspace's
// packages, and rustup's installer puts its tools in the home directory,
// which Gradle's PATH need not name.
def number = tasks.register("numberCorePaths", Exec) {
  def build = xpute.tasks.named("buildGuestRelease")
  dependsOn build
  outputs.upToDateWhen { false }
  environment "PATH", "${System.getProperty("user.home")}/.cargo/bin:${System.getenv("PATH")}"
  // The library lies under the ABI it is packed for, which names its table.
  def so = build.get().outputs.files.singleFile
  commandLine "${app}/script/number-paths.py",
    so.absolutePath,
    "${app}/core.paths.${so.parentFile.name}.json",
    new File(app, guest.workspace).canonicalPath
}
xpute.tasks.matching { it.name == "mergeReleaseJniLibFolders" }.configureEach { dependsOn number }
