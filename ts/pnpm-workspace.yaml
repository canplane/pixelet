# pixelet's TypeScript: the client, one Expo app for the page and the device,
# the scripts its bundler reads it through; the shader tools; and xpute's
# packages, as their own workspace lists them.
packages:
  - client
  - build
  - tool/shader
  - ../xpute/ts/*

# Dawn, which the shader test compiles on, installs its binary.
onlyBuiltDependencies:
  - webgpu
