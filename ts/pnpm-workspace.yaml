# pixelet's TypeScript workspace. It holds the client, which is one Expo app
# for the web and native; the build scripts its bundler reads the client
# through; the XR app (xr); the shader tools; the GPU, pixelet's plugin of
# xpute (gpu/); and xpute's packages, as xpute's own workspace lists them.
packages:
  - client
  - xr
  - build
  - tool/shader
  - gpu
  - ../xpute/kit/ts
  - ../xpute/link/ts
  - ../xpute/host/ts
  - ../xpute/runtime/web
  - ../xpute/expo
  - ../xpute/golden/ts

# Only webgpu may run its install script, which installs the binary of Dawn,
# the WebGPU implementation the shader test compiles shaders on. Carbon's icons
# may not: theirs only sends IBM a report of the install.
allowBuilds:
  webgpu: true
  "@carbon/icons": false
